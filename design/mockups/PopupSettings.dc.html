<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Binder: настройки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Rubik:wght@400;500;600;700&amp;family=Press+Start+2P&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 380px; height: 600px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.tx}}; font-family: {{t.ff}}">
  <header style="height: 60px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 18px 0 8px; background: {{t.hd}}; color: {{t.oh}}; border-bottom: {{t.bw}} solid {{t.hl}}">
    <a href="Main.dc.html" aria-label="Назад" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.oh}}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-family: {{t.fd}}; font-weight: {{t.dw}}; font-size: {{sz.title}}">Настройки</span>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 18px">
    <section style="display: flex; flex-direction: column; gap: 6px">
      <label for="key" style="font-size: 13px; font-weight: 600">Ключ DeepSeek</label>
      <input id="key" type="password" value="{{key}}" onChange="{{onKey}}" style="height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: {{t.rs}}; border: {{t.bw}} solid {{t.ln}}; background: {{t.s1}}; color: {{t.tx}}; font-family: {{t.ff}}; font-size: 15px; outline: none">
      <div style="display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 12px; font-weight: 600; color: {{t.up}}">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        Ключ работает, модель V4.1 Flash
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; font-weight: 600">Тема</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{themes}}" as="th" hint-placeholder-count="4">
          <button onClick="{{th.pick}}" aria-pressed="{{th.on}}" style="{{th.btn}}">
            <span style="{{th.prev}}">
              <span style="{{th.bar}}"></span>
              <span style="{{th.line1}}"></span>
              <span style="{{th.line2}}"></span>
              <span style="{{th.cta}}"></span>
            </span>
            <span style="{{th.label}}">{{th.name}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; font-weight: 600; margin-bottom: 2px">Мои фото карточек</div>
      <sc-for list="{{stores}}" as="r" hint-placeholder-count="3">
        <label style="{{r.row}}">
          <input type="radio" name="store" checked="{{r.on}}" onChange="{{r.pick}}" style="{{r.input}}">
          <span>{{r.label}}</span>
        </label>
      </sc-for>
    </section>
  </main>

  <footer style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 12px 10px 12px 18px; border-top: {{t.bw}} solid {{t.ln}}">
    <div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{t.s2}}; border: {{t.bw}} solid {{t.ln}}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c.8-3.4 3.6-5.2 7-5.2s6.2 1.8 7 5.2"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <span style="font-size: 13px; font-weight: 600">you@gmail.com</span>
      <span style="font-size: 12px; color: {{t.mu}}">Осталось 3 приглашения</span>
    </div>
    <a href="PopupWelcome.dc.html" style="margin-left: auto; height: 44px; padding: 0 10px; display: flex; align-items: center; font-size: 13px; font-weight: 500; color: {{t.lk}}; text-decoration: none">Выйти</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Монохром","Светлая","Покемон","Ретро"],"default":"Монохром"},"$preview":{"width":380,"height":600}}'>
const THEMES = {
  'Монохром': { bg: '#0A0A0B', s1: '#121214', s2: '#1A1A1D', ln: '#26262B', tx: '#F4F4F5', mu: '#8E8E96', ac: '#F4F4F5', oa: '#0A0A0B', lk: '#F4F4F5', se: '#F4F4F5', os: '#0A0A0B', up: '#F4F4F5', dn: '#8E8E96', ch: '#F4F4F5', fill: 'rgba(244,244,245,.07)', hd: '#0A0A0B', oh: '#F4F4F5', hm: '#8E8E96', hl: '#26262B', hf: '#121214', hft: '#F4F4F5', ff: 'Onest, system-ui, sans-serif', fd: 'Onest, system-ui, sans-serif', dw: '600', ls: '-0.03em', z: 1, r: '14px', rs: '10px', bw: '1px', sh: '0 30px 60px rgba(0,0,0,.6)', cf: '#D5D8DE', hp: '#F4F4F5', bk: '#1A1A1D', bk2: '#26262B', retro: false },
  'Светлая': { bg: '#F4F4F5', s1: '#FFFFFF', s2: '#EBEBED', ln: '#DEDEE2', tx: '#0A0A0B', mu: '#64646C', ac: '#0A0A0B', oa: '#FFFFFF', lk: '#0A0A0B', se: '#0A0A0B', os: '#FFFFFF', up: '#0A0A0B', dn: '#64646C', ch: '#0A0A0B', fill: 'rgba(10,10,11,.06)', hd: '#FFFFFF', oh: '#0A0A0B', hm: '#64646C', hl: '#DEDEE2', hf: '#F4F4F5', hft: '#0A0A0B', ff: 'Onest, system-ui, sans-serif', fd: 'Onest, system-ui, sans-serif', dw: '600', ls: '-0.03em', z: 1, r: '14px', rs: '10px', bw: '1px', sh: '0 24px 50px rgba(10,10,11,.16)', cf: '#D5D8DE', hp: '#0A0A0B', bk: '#E4E4E7', bk2: '#D4D4D8', retro: false },
  'Покемон': { bg: '#F2F4F8', s1: '#FFFFFF', s2: '#E8ECF3', ln: '#D9DFE9', tx: '#14171F', mu: '#566070', ac: '#CC2D0E', oa: '#FFFFFF', lk: '#2366A8', se: '#FFCB05', os: '#1A1400', up: '#1F7A4D', dn: '#CC2D0E', ch: '#2366A8', fill: 'rgba(35,102,168,.10)', hd: '#CC2D0E', oh: '#FFFFFF', hm: '#FFFFFF', hl: '#B0260B', hf: '#FFFFFF', hft: '#14171F', ff: 'Rubik, system-ui, sans-serif', fd: 'Rubik, system-ui, sans-serif', dw: '700', ls: '-0.02em', z: 1, r: '16px', rs: '12px', bw: '1px', sh: '0 24px 48px rgba(20,23,31,.18)', cf: '#F2C935', hp: '#1F7A4D', bk: '#2366A8', bk2: '#1D5A96', retro: false },
  'Ретро': { bg: '#8BAC0F', s1: '#9BBC0F', s2: '#8BAC0F', ln: '#0F380F', tx: '#0F380F', mu: '#0F380F', ac: '#0F380F', oa: '#9BBC0F', lk: '#0F380F', se: '#0F380F', os: '#9BBC0F', up: '#0F380F', dn: '#0F380F', ch: '#0F380F', fill: 'rgba(15,56,15,.12)', hd: '#0F380F', oh: '#9BBC0F', hm: '#9BBC0F', hl: '#0F380F', hf: '#9BBC0F', hft: '#0F380F', ff: 'Onest, system-ui, sans-serif', fd: "'Press Start 2P', monospace", dw: '400', ls: '0', z: 0.62, r: '0px', rs: '0px', bw: '2px', sh: '6px 6px 0 #306230', cf: '#0F380F', hp: '#0F380F', bk: '#306230', bk2: '#0F380F', retro: true }
};
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const name = s.theme || this.props.theme || 'Монохром';
    const t = THEMES[name] || THEMES['Монохром'];
    const px = (n) => Math.round(n * t.z) + 'px';
    const themes = Object.keys(THEMES).map((key) => {
      const p = THEMES[key];
      const on = key === name;
      const small = p.retro ? '0' : '3px';
      return {
        name: key,
        on,
        pick: () => this.setState({ theme: key }),
        btn: 'display: flex; flex-direction: column; gap: 6px; padding: 0; border: none; background: transparent; cursor: pointer; text-align: left; font-family: ' + t.ff,
        prev: 'position: relative; display: block; height: 56px; overflow: hidden; box-sizing: border-box; border-radius: ' + (p.retro ? '0' : '8px') + '; background: ' + p.bg + '; border: 1px solid ' + p.ln + '; box-shadow: ' + (on ? '0 0 0 2px ' + t.bg + ', 0 0 0 4px ' + t.ac : 'none'),
        bar: 'position: absolute; left: 0; right: 0; top: 0; height: 10px; display: block; background: ' + p.hd + '; border-bottom: 1px solid ' + p.hl,
        line1: 'position: absolute; left: 7px; top: 17px; width: 52%; height: 5px; display: block; border-radius: ' + small + '; background: ' + p.tx,
        line2: 'position: absolute; left: 7px; top: 27px; width: 34%; height: 4px; display: block; border-radius: ' + small + '; background: ' + p.mu,
        cta: 'position: absolute; left: 7px; right: 7px; bottom: 7px; height: 9px; display: block; border-radius: ' + small + '; background: ' + p.ac,
        label: 'font-size: 12px; color: ' + t.tx + '; font-weight: ' + (on ? '600' : '400')
      };
    });
    const store = s.store || 'none';
    const stores = [
      ['none', 'Не хранить, только для сканера'],
      ['drive', 'Сохранять в мой Google Drive'],
      ['cloud', 'Сохранять превью в облаке Binder']
    ].map(([id, label]) => ({
      label,
      on: store === id,
      pick: () => this.setState({ store: id }),
      row: 'display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; cursor: pointer',
      input: 'width: 18px; height: 18px; margin: 0; accent-color: ' + t.ac
    }));
    return {
      t,
      themes,
      stores,
      key: s.key == null ? 'sk-4f9a2c71b8e03d5a' : s.key,
      onKey: (e) => this.setState({ key: e.target.value }),
      sz: { title: px(16) }
    };
  }
}
</script>
</body>
</html>
