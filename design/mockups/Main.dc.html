<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Binder: поп-ап, главная</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Rubik:wght@400;500;600;700&amp;family=Press+Start+2P&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 380px; height: 600px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.tx}}; font-family: {{t.ff}}">
  <header style="height: 60px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 18px; background: {{t.hd}}; color: {{t.oh}}; border-bottom: {{t.bw}} solid {{t.hl}}">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><rect x="3" y="6" width="11" height="15" rx="2"></rect><path d="M8 3.6l8.6-.9a2 2 0 0 1 2.2 1.8l1.2 11.3a2 2 0 0 1-1.8 2.2l-2.2.2"></path></svg>
    <span style="font-family: {{t.fd}}; font-weight: {{t.dw}}; font-size: {{sz.logo}}; letter-spacing: -0.01em">Binder</span>
    <a href="PopupSettings.dc.html" aria-label="Настройки" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: {{t.rs}}; color: {{t.oh}}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>
    </a>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 20px 18px 0">
    <section style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; color: {{t.mu}}">Стоимость коллекции</div>
      <div style="display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px">
        <span style="font-family: {{t.fd}}; font-weight: {{t.dw}}; font-size: {{sz.value}}; letter-spacing: {{t.ls}}; line-height: 1.15; font-variant-numeric: tabular-nums">$1 284</span>
        <span style="font-size: 13px; font-weight: 600; color: {{t.up}}">▲ 12,4%</span>
        <span style="font-size: 13px; color: {{t.mu}}">за 30 дней</span>
      </div>
      <svg role="img" aria-label="Стоимость коллекции растёт последние 30 дней" width="344" height="44" viewBox="0 0 344 44" style="display: block; margin-top: 4px">
        <polygon points="0,36 29,34 57,38 86,31 115,32 143,26 172,27 201,20 229,22 258,14 287,15 315,9 344,6 344,44 0,44" fill="{{t.fill}}"></polygon>
        <polyline points="0,36 29,34 57,38 86,31 115,32 143,26 172,27 201,20 229,22 258,14 287,15 315,9 344,6" fill="none" stroke="{{t.ch}}" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"></polyline>
      </svg>
      <div style="display: flex; align-items: center; gap: 14px; margin-top: 6px">
        <div style="display: flex; align-items: baseline; gap: 5px"><span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">148</span><span style="font-size: 12px; color: {{t.mu}}">карточек</span></div>
        <div style="width: {{t.bw}}; height: 16px; background: {{t.ln}}"></div>
        <div style="display: flex; align-items: baseline; gap: 5px"><span style="font-size: 15px; font-weight: 600">6</span><span style="font-size: 12px; color: {{t.mu}}">сетов</span></div>
        <div style="width: {{t.bw}}; height: 16px; background: {{t.ln}}"></div>
        <div style="display: flex; align-items: baseline; gap: 5px"><span style="font-size: 15px; font-weight: 600">2</span><span style="font-size: 12px; color: {{t.mu}}">колоды</span></div>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <a href="PopupScan.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: {{t.rs}}; background: {{t.ac}}; color: {{t.oa}}; font-size: 15px; font-weight: 600; text-decoration: none; box-shadow: {{sz.btnShadow}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"></path><path d="M7 12h10"></path></svg>
        Сканировать карточки
      </a>
      <div style="font-size: 12px; color: {{t.mu}}; text-align: center">или перетащи фото прямо в это окно</div>
    </div>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 13px; font-weight: 600">Недавно добавлены</span>
        <a href="Library.dc.html" style="font-size: 13px; font-weight: 500; color: {{t.lk}}; text-decoration: none">Открыть альбом</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; font-size: 12px; color: {{t.mu}}">
        <sc-for list="{{recent}}" as="c" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <div style="{{c.frame}}">
              <div style="{{c.body}}">
                <div style="position: absolute; left: 7%; top: 4.5%; width: 46%; height: 5%; border-radius: 2px; background: rgba(0,0,0,.24)"></div>
                <div style="position: absolute; right: 7%; top: 3.5%; width: 12%; aspect-ratio: 1 / 1; border-radius: 50%; background: rgba(255,255,255,.65)"></div>
                <div style="{{c.art}}"><div style="width: 40%; aspect-ratio: 1 / 1; border-radius: 50%; background: rgba(255,255,255,.3)"></div></div>
                <div style="position: absolute; left: 7%; top: 62%; width: 78%; height: 3.5%; border-radius: 2px; background: rgba(0,0,0,.2)"></div>
                <div style="position: absolute; left: 7%; top: 69%; width: 56%; height: 3.5%; border-radius: 2px; background: rgba(0,0,0,.2)"></div>
                <div style="position: absolute; left: 7%; top: 78%; width: 70%; height: 3.5%; border-radius: 2px; background: rgba(0,0,0,.2)"></div>
                <div style="position: absolute; left: 7%; bottom: 5%; width: 26%; height: 2.5%; border-radius: 2px; background: rgba(0,0,0,.16)"></div>
              </div>
            </div>
            <div style="font-variant-numeric: tabular-nums">{{c.price}}</div>
          </div>
        </sc-for>
      </div>
    </section>
  </main>

  <nav aria-label="Разделы" style="height: 64px; flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: {{t.bw}} solid {{t.ln}}; background: {{t.bg}}">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.ac}}; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"></path></svg>
      Главная
    </a>
    <a href="Library.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.mu}}; text-decoration: none; font-size: 12px; font-weight: 500">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="4" y="4" width="6.5" height="8" rx="1.2"></rect><rect x="13.5" y="4" width="6.5" height="8" rx="1.2"></rect><rect x="4" y="15" width="6.5" height="5" rx="1.2"></rect><rect x="13.5" y="15" width="6.5" height="5" rx="1.2"></rect></svg>
      Альбом
    </a>
    <a href="Deck.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.mu}}; text-decoration: none; font-size: 12px; font-weight: 500">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><rect x="7" y="3.5" width="10" height="14" rx="1.5"></rect><path d="M4.5 7v11.5a2 2 0 0 0 2 2h9"></path></svg>
      Колоды
    </a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.mu}}; text-decoration: none; font-size: 12px; font-weight: 500">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="9" cy="8.5" r="3.2"></circle><path d="M3.5 19.5c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6"></path><path d="M15.5 5.6a3 3 0 0 1 0 5.8M17.5 14.9c1.6.6 2.7 2 3 4.6"></path></svg>
      Друзья
    </a>
    <a href="Battle.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.mu}}; text-decoration: none; font-size: 12px; font-weight: 500">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M13.5 3L5 13.5h6L10 21l8.5-10.5h-6z"></path></svg>
      Бой
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Монохром","Светлая","Покемон","Ретро"],"default":"Монохром"},"$preview":{"width":380,"height":600}}'>
const THEMES = {
  'Монохром': { bg: '#0A0A0B', s1: '#121214', s2: '#1A1A1D', ln: '#26262B', tx: '#F4F4F5', mu: '#8E8E96', ac: '#F4F4F5', oa: '#0A0A0B', lk: '#F4F4F5', se: '#F4F4F5', os: '#0A0A0B', up: '#F4F4F5', dn: '#8E8E96', ch: '#F4F4F5', fill: 'rgba(244,244,245,.07)', hd: '#0A0A0B', oh: '#F4F4F5', hm: '#8E8E96', hl: '#26262B', hf: '#121214', hft: '#F4F4F5', ff: 'Onest, system-ui, sans-serif', fd: 'Onest, system-ui, sans-serif', dw: '600', ls: '-0.03em', z: 1, r: '14px', rs: '10px', bw: '1px', sh: '0 30px 60px rgba(0,0,0,.6)', cf: '#D5D8DE', hp: '#F4F4F5', bk: '#1A1A1D', bk2: '#26262B', retro: false },
  'Светлая': { bg: '#F4F4F5', s1: '#FFFFFF', s2: '#EBEBED', ln: '#DEDEE2', tx: '#0A0A0B', mu: '#64646C', ac: '#0A0A0B', oa: '#FFFFFF', lk: '#0A0A0B', se: '#0A0A0B', os: '#FFFFFF', up: '#0A0A0B', dn: '#64646C', ch: '#0A0A0B', fill: 'rgba(10,10,11,.06)', hd: '#FFFFFF', oh: '#0A0A0B', hm: '#64646C', hl: '#DEDEE2', hf: '#F4F4F5', hft: '#0A0A0B', ff: 'Onest, system-ui, sans-serif', fd: 'Onest, system-ui, sans-serif', dw: '600', ls: '-0.03em', z: 1, r: '14px', rs: '10px', bw: '1px', sh: '0 24px 50px rgba(10,10,11,.16)', cf: '#D5D8DE', hp: '#0A0A0B', bk: '#E4E4E7', bk2: '#D4D4D8', retro: false },
  'Покемон': { bg: '#F2F4F8', s1: '#FFFFFF', s2: '#E8ECF3', ln: '#D9DFE9', tx: '#14171F', mu: '#566070', ac: '#CC2D0E', oa: '#FFFFFF', lk: '#2366A8', se: '#FFCB05', os: '#1A1400', up: '#1F7A4D', dn: '#CC2D0E', ch: '#2366A8', fill: 'rgba(35,102,168,.10)', hd: '#CC2D0E', oh: '#FFFFFF', hm: '#FFFFFF', hl: '#B0260B', hf: '#FFFFFF', hft: '#14171F', ff: 'Rubik, system-ui, sans-serif', fd: 'Rubik, system-ui, sans-serif', dw: '700', ls: '-0.02em', z: 1, r: '16px', rs: '12px', bw: '1px', sh: '0 24px 48px rgba(20,23,31,.18)', cf: '#F2C935', hp: '#1F7A4D', bk: '#2366A8', bk2: '#1D5A96', retro: false },
  'Ретро': { bg: '#8BAC0F', s1: '#9BBC0F', s2: '#8BAC0F', ln: '#0F380F', tx: '#0F380F', mu: '#0F380F', ac: '#0F380F', oa: '#9BBC0F', lk: '#0F380F', se: '#0F380F', os: '#9BBC0F', up: '#0F380F', dn: '#0F380F', ch: '#0F380F', fill: 'rgba(15,56,15,.12)', hd: '#0F380F', oh: '#9BBC0F', hm: '#9BBC0F', hl: '#0F380F', hf: '#9BBC0F', hft: '#0F380F', ff: 'Onest, system-ui, sans-serif', fd: "'Press Start 2P', monospace", dw: '400', ls: '0', z: 0.62, r: '0px', rs: '0px', bw: '2px', sh: '6px 6px 0 #306230', cf: '#0F380F', hp: '#0F380F', bk: '#306230', bk2: '#0F380F', retro: true }
};
const TYPES = { fire: ['#E57A4E', '#F7B892', '#D4532B'], water: ['#5494DA', '#A7CCF3', '#2F6CB5'], grass: ['#71B56B', '#BCE3A6', '#3F8C47'], electric: ['#E8C24A', '#FBE9A3', '#CFA21E'], psychic: ['#9D7CD8', '#D6C6F4', '#6A4BB3'], normal: ['#B4B8C1', '#E9EAEE', '#8B909A'], dark: ['#50545F', '#9095A1', '#2B2E36'] };
function look(t, type, holo, extra) {
  const c = t.retro ? ['#306230', '#9BBC0F', '#8BAC0F'] : TYPES[type];
  const art = t.retro
    ? (holo ? 'repeating-linear-gradient(45deg, #9BBC0F 0 4px, #8BAC0F 4px 8px)' : '#9BBC0F')
    : (holo ? 'linear-gradient(150deg, ' + c[1] + ' 0%, rgba(255,255,255,.92) 46%, ' + c[2] + ' 100%)' : 'linear-gradient(160deg, ' + c[1] + ' 0%, ' + c[2] + ' 100%)');
  return {
    frame: 'position: relative; aspect-ratio: 63 / 88; border-radius: ' + (t.retro ? '0' : '6px') + '; background: ' + t.cf + (extra ? '; ' + extra : ''),
    body: 'position: absolute; inset: 4.5%; overflow: hidden; border-radius: ' + (t.retro ? '0' : '3px') + '; background: ' + c[0],
    art: 'position: absolute; left: 7%; right: 7%; top: 13%; height: 42%; display: flex; align-items: center; justify-content: center; border-radius: ' + (t.retro ? '0' : '2px') + '; background: ' + art
  };
}
class Component extends DCLogic {
  renderVals() {
    const t = THEMES[this.props.theme] || THEMES['Монохром'];
    const px = (n) => Math.round(n * t.z) + 'px';
    const recent = [
      ['fire', true, '$24,80'], ['water', false, '$6,10'], ['psychic', false, '$3,40'], ['electric', false, '$0,90']
    ].map(([type, holo, price]) => Object.assign(look(t, type, holo), { price }));
    return {
      t,
      recent,
      sz: { logo: px(17), value: px(40), btnShadow: t.retro ? '4px 4px 0 #306230' : 'none' }
    };
  }
}
</script>
</body>
</html>
