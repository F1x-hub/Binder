<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Binder: сканирование</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Rubik:wght@400;500;600;700&amp;family=Press+Start+2P&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 380px; height: 600px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.tx}}; font-family: {{t.ff}}">
  <header style="height: 60px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 18px 0 8px; background: {{t.hd}}; color: {{t.oh}}">
    <a href="Main.dc.html" aria-label="Назад" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.oh}}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-family: {{t.fd}}; font-weight: {{t.dw}}; font-size: {{sz.title}}">Сканирование</span>
    <span style="margin-left: auto; font-size: 13px; color: {{t.hm}}; font-variant-numeric: tabular-nums">3 из 5</span>
  </header>
  <div style="height: 2px; flex-shrink: 0; background: {{t.ln}}"><div style="width: 60%; height: 2px; background: {{t.ac}}"></div></div>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 18px">
    <section style="display: flex; gap: 16px">
      <div style="width: 92px; flex-shrink: 0">
        <div style="{{main.frame}}">
          <div style="{{main.body}}">
            <div style="position: absolute; left: 7%; top: 4.5%; width: 46%; height: 5%; border-radius: 2px; background: rgba(0,0,0,.24)"></div>
            <div style="position: absolute; right: 7%; top: 3.5%; width: 12%; aspect-ratio: 1 / 1; border-radius: 50%; background: rgba(255,255,255,.65)"></div>
            <div style="{{main.art}}"><div style="width: 40%; aspect-ratio: 1 / 1; border-radius: 50%; background: rgba(255,255,255,.3)"></div></div>
            <div style="position: absolute; left: 7%; top: 62%; width: 78%; height: 3.5%; border-radius: 2px; background: rgba(0,0,0,.2)"></div>
            <div style="position: absolute; left: 7%; top: 69%; width: 56%; height: 3.5%; border-radius: 2px; background: rgba(0,0,0,.2)"></div>
            <div style="position: absolute; left: 7%; top: 78%; width: 70%; height: 3.5%; border-radius: 2px; background: rgba(0,0,0,.2)"></div>
            <div style="position: absolute; left: 7%; bottom: 5%; width: 26%; height: 2.5%; border-radius: 2px; background: rgba(0,0,0,.16)"></div>
          </div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: {{t.up}}">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          Распознано, 94%
        </div>
        <div style="font-size: 18px; font-weight: 600; margin-top: 2px">Charizard ex</div>
        <div style="font-size: 13px; color: {{t.mu}}">Obsidian Flames · 125/197</div>
        <div style="font-size: 13px; color: {{t.mu}}">Double Rare · голо</div>
        <div style="display: flex; align-items: baseline; gap: 6px; margin-top: auto">
          <span style="font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums">$24,80</span>
          <span style="font-size: 12px; color: {{t.mu}}">без грейда</span>
        </div>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 12px; color: {{t.mu}}">Какое фото показывать в альбоме</div>
      <div role="group" aria-label="Фото в альбоме" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: {{t.rs}}; background: {{t.s2}}; border: {{t.bw}} solid {{t.ln}}">
        <button onClick="{{pickScan}}" style="{{seg.scan}}">Официальный скан</button>
        <button onClick="{{pickMine}}" style="{{seg.mine}}">Моё фото</button>
      </div>
    </div>

    <div style="height: {{t.bw}}; background: {{t.ln}}"></div>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div>
        <div style="font-size: 13px; font-weight: 600">Следующая: нужна твоя помощь</div>
        <div style="font-size: 12px; color: {{t.mu}}; margin-top: 2px">ИИ видит два похожих варианта</div>
      </div>
      <sc-for list="{{options}}" as="o" hint-placeholder-count="2">
        <button onClick="{{o.pick}}" style="{{o.row}}">
          <div style="width: 30px; flex-shrink: 0">
            <div style="{{o.frame}}">
              <div style="{{o.body}}">
                <div style="{{o.art}}"></div>
              </div>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px; text-align: left; min-width: 0">
            <span style="font-size: 14px; font-weight: 600">{{o.name}}</span>
            <span style="{{o.metaStyle}}">{{o.meta}}</span>
          </div>
          <span style="{{o.radio}}"></span>
        </button>
      </sc-for>
    </section>
  </main>

  <footer style="flex-shrink: 0; display: flex; gap: 8px; padding: 12px 18px; border-top: {{t.bw}} solid {{t.ln}}">
    <button style="flex: 1 1 0; height: 48px; border-radius: {{t.rs}}; border: {{t.bw}} solid {{t.ln}}; background: transparent; color: {{t.tx}}; font-family: {{t.ff}}; font-size: 14px; font-weight: 600; cursor: pointer">Пропустить</button>
    <a href="Library.dc.html" style="flex: 2 1 0; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: {{t.rs}}; background: {{t.ac}}; color: {{t.oa}}; font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: {{sz.btnShadow}}">Добавить 3 в альбом</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Монохром","Светлая","Покемон","Ретро"],"default":"Монохром"},"$preview":{"width":380,"height":600}}'>
const THEMES = {
  'Монохром': { bg: '#0A0A0B', s1: '#121214', s2: '#1A1A1D', ln: '#26262B', tx: '#F4F4F5', mu: '#8E8E96', ac: '#F4F4F5', oa: '#0A0A0B', lk: '#F4F4F5', se: '#F4F4F5', os: '#0A0A0B', up: '#F4F4F5', dn: '#8E8E96', ch: '#F4F4F5', fill: 'rgba(244,244,245,.07)', hd: '#0A0A0B', oh: '#F4F4F5', hm: '#8E8E96', hl: '#26262B', hf: '#121214', hft: '#F4F4F5', ff: 'Onest, system-ui, sans-serif', fd: 'Onest, system-ui, sans-serif', dw: '600', ls: '-0.03em', z: 1, r: '14px', rs: '10px', bw: '1px', sh: '0 30px 60px rgba(0,0,0,.6)', cf: '#D5D8DE', hp: '#F4F4F5', bk: '#1A1A1D', bk2: '#26262B', retro: false },
  'Светлая': { bg: '#F4F4F5', s1: '#FFFFFF', s2: '#EBEBED', ln: '#DEDEE2', tx: '#0A0A0B', mu: '#64646C', ac: '#0A0A0B', oa: '#FFFFFF', lk: '#0A0A0B', se: '#0A0A0B', os: '#FFFFFF', up: '#0A0A0B', dn: '#64646C', ch: '#0A0A0B', fill: 'rgba(10,10,11,.06)', hd: '#FFFFFF', oh: '#0A0A0B', hm: '#64646C', hl: '#DEDEE2', hf: '#F4F4F5', hft: '#0A0A0B', ff: 'Onest, system-ui, sans-serif', fd: 'Onest, system-ui, sans-serif', dw: '600', ls: '-0.03em', z: 1, r: '14px', rs: '10px', bw: '1px', sh: '0 24px 50px rgba(10,10,11,.16)', cf: '#D5D8DE', hp: '#0A0A0B', bk: '#E4E4E7', bk2: '#D4D4D8', retro: false },
  'Покемон': { bg: '#F2F4F8', s1: '#FFFFFF', s2: '#E8ECF3', ln: '#D9DFE9', tx: '#14171F', mu: '#566070', ac: '#CC2D0E', oa: '#FFFFFF', lk: '#2366A8', se: '#FFCB05', os: '#1A1400', up: '#1F7A4D', dn: '#CC2D0E', ch: '#2366A8', fill: 'rgba(35,102,168,.10)', hd: '#CC2D0E', oh: '#FFFFFF', hm: '#FFFFFF', hl: '#B0260B', hf: '#FFFFFF', hft: '#14171F', ff: 'Rubik, system-ui, sans-serif', fd: 'Rubik, system-ui, sans-serif', dw: '700', ls: '-0.02em', z: 1, r: '16px', rs: '12px', bw: '1px', sh: '0 24px 48px rgba(20,23,31,.18)', cf: '#F2C935', hp: '#1F7A4D', bk: '#2366A8', bk2: '#1D5A96', retro: false },
  'Ретро': { bg: '#8BAC0F', s1: '#9BBC0F', s2: '#8BAC0F', ln: '#0F380F', tx: '#0F380F', mu: '#0F380F', ac: '#0F380F', oa: '#9BBC0F', lk: '#0F380F', se: '#0F380F', os: '#9BBC0F', up: '#0F380F', dn: '#0F380F', ch: '#0F380F', fill: 'rgba(15,56,15,.12)', hd: '#0F380F', oh: '#9BBC0F', hm: '#9BBC0F', hl: '#0F380F', hf: '#9BBC0F', hft: '#0F380F', ff: 'Onest, system-ui, sans-serif', fd: "'Press Start 2P', monospace", dw: '400', ls: '0', z: 0.62, r: '0px', rs: '0px', bw: '2px', sh: '6px 6px 0 #306230', cf: '#0F380F', hp: '#0F380F', bk: '#306230', bk2: '#0F380F', retro: true }
};
const TYPES = { fire: ['#E57A4E', '#F7B892', '#D4532B'], water: ['#5494DA', '#A7CCF3', '#2F6CB5'], grass: ['#71B56B', '#BCE3A6', '#3F8C47'], electric: ['#E8C24A', '#FBE9A3', '#CFA21E'], psychic: ['#9D7CD8', '#D6C6F4', '#6A4BB3'], normal: ['#B4B8C1', '#E9EAEE', '#8B909A'], dark: ['#50545F', '#9095A1', '#2B2E36'] };
function look(t, type, holo, extra) {
  const c = t.retro ? ['#306230', '#9BBC0F', '#8BAC0F'] : TYPES[type];
  const art = t.retro
    ? (holo ? 'repeating-linear-gradient(45deg, #9BBC0F 0 4px, #8BAC0F 4px 8px)' : '#9BBC0F')
    : (holo ? 'linear-gradient(150deg, ' + c[1] + ' 0%, rgba(255,255,255,.92) 46%, ' + c[2] + ' 100%)' : 'linear-gradient(160deg, ' + c[1] + ' 0%, ' + c[2] + ' 100%)');
  return {
    frame: 'position: relative; aspect-ratio: 63 / 88; border-radius: ' + (t.retro ? '0' : '6px') + '; background: ' + t.cf + (extra ? '; ' + extra : ''),
    body: 'position: absolute; inset: 4.5%; overflow: hidden; border-radius: ' + (t.retro ? '0' : '3px') + '; background: ' + c[0],
    art: 'position: absolute; left: 7%; right: 7%; top: 13%; height: 42%; display: flex; align-items: center; justify-content: center; border-radius: ' + (t.retro ? '0' : '2px') + '; background: ' + art
  };
}
class Component extends DCLogic {
  renderVals() {
    const t = THEMES[this.props.theme] || THEMES['Монохром'];
    const px = (n) => Math.round(n * t.z) + 'px';
    const s = this.state || {};
    const photo = s.photo || 'scan';
    const picked = s.picked == null ? 0 : s.picked;
    const segBase = 'height: 42px; border: none; cursor: pointer; font-family: ' + t.ff + '; font-size: 13px; font-weight: 600; border-radius: ' + (t.retro ? '0' : '8px') + '; ';
    const seg = {
      scan: segBase + (photo === 'scan' ? 'background: ' + t.se + '; color: ' + t.os : 'background: transparent; color: ' + t.mu),
      mine: segBase + (photo === 'mine' ? 'background: ' + t.se + '; color: ' + t.os : 'background: transparent; color: ' + t.mu)
    };
    const options = [
      { name: 'Pikachu ex', meta: 'Surging Sparks · 238/191 · SIR', type: 'electric', holo: true },
      { name: 'Pikachu ex', meta: 'Surging Sparks · 057/191 · Double Rare', type: 'electric', holo: false }
    ].map((o, i) => {
      const on = i === picked;
      return Object.assign(look(t, o.type, o.holo), o, {
        pick: () => this.setState({ picked: i }),
        row: 'display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px; box-sizing: border-box; cursor: pointer; font-family: ' + t.ff + '; color: ' + t.tx + '; background: ' + t.s1 + '; border-radius: ' + t.rs + '; border: ' + (on ? '2px solid ' + t.ac : t.bw + ' solid ' + t.ln),
        metaStyle: 'font-size: 12px; color: ' + t.mu,
        radio: 'margin-left: auto; flex-shrink: 0; width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; border: 2px solid ' + (on ? t.ac : t.mu) + '; background: ' + (on ? t.ac : 'transparent') + '; box-shadow: inset 0 0 0 3px ' + (on ? t.s1 : 'transparent')
      });
    });
    return {
      t,
      main: look(t, 'fire', true),
      seg,
      pickScan: () => this.setState({ photo: 'scan' }),
      pickMine: () => this.setState({ photo: 'mine' }),
      options,
      sz: { title: px(16), btnShadow: t.retro ? '4px 4px 0 #306230' : 'none' }
    };
  }
}
</script>
</body>
</html>
